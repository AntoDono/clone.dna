[project]
name = "backend"
version = "0.1.0"
description = "Clone.dna backend — LoRA adapter minting, hot-swap inference, and talent registry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "peewee==3.17.6",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "uvicorn[standard]==0.30.6",
    "openai>=1.30.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "torch>=2.2.0",
    "accelerate>=0.27.0",
    "datasets>=2.18.0",
    "optimum>=1.19.0",
    "gptqmodel>=2.0.0",
    "bitsandbytes>=0.49.2",
    "discord.py>=2.3.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["trainer", "extractor", "routes"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
